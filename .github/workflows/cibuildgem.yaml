name: "Package and release gems with precompiled binaries"
on:
  workflow_dispatch:
    inputs:
      release:
        description: "If the whole build passes on all platforms, release the gems on RubyGems.org"
        required: false
        type: boolean
        default: false
  push:
    branches: ["setup-cibuildgem"]
env:
  CIBUILDGEM: 1
jobs:
  compile:
    timeout-minutes: 20
    name: "Cross compile the gem on different ruby versions"
    env:
      PUMA_DISABLE_SSL: 1
      # cibuildgem's default series no longer includes the EOL Ruby 3.0, but
      # puma still supports it (required_ruby_version >= 3.0). Override the
      # cross-compile list to also ship a 3.0 binary.
      RUBY_CC_VERSION: "4.0.0:3.4.6:3.3.8:3.2.8:3.1.6:3.0.7"
    strategy:
      matrix:
        os: ["macos-latest", "ubuntu-22.04"]
    runs-on: "${{ matrix.os }}"
    steps:
      - name: "Checkout code"
        uses: "actions/checkout@v5"
      - name: "Setup Ruby"
        uses: "ruby/setup-ruby-pkgs@v1"
        with:
          ruby-version: "3.1.7"
          apt-get: ragel
          brew: ragel
          bundler-cache: true
      - name: "Run cibuildgem"
        uses: "shopify/cibuildgem/.github/actions/cibuildgem@main"
        with:
          step: "compile"
  test:
    timeout-minutes: 20
    name: "Run the test suite"
    needs: compile
    env:
      PUMA_DISABLE_SSL: 1
      PUMA_SKIP_LOCAL_COMPILE: ${{ matrix.type == 'cross' && '1' || '0' }}
    strategy:
      matrix:
        os: ["macos-latest", "ubuntu-22.04"]
        rubies: ["3.0", "3.1", "3.2", "3.3", "3.4", "4.0"]
        type: ["cross", "native"]
    runs-on: "${{ matrix.os }}"
    steps:
      - name: "Checkout code"
        uses: "actions/checkout@v5"
      - name: "Setup Ruby"
        uses: "ruby/setup-ruby-pkgs@v1"
        with:
          ruby-version: "${{ matrix.rubies }}"
          apt-get: ragel
          brew: ragel
          bundler-cache: true
      - name: "Run cibuildgem"
        uses: "shopify/cibuildgem/.github/actions/cibuildgem@main"
        with:
          step: "test_${{ matrix.type }}"
  install:
    timeout-minutes: 5
    name: "Verify the gem can be installed"
    needs: test
    strategy:
      matrix:
        os: ["macos-latest", "ubuntu-22.04"]
    runs-on: "${{ matrix.os }}"
    steps:
      - name: "Setup Ruby"
        uses: "ruby/setup-ruby@v1"
        with:
          ruby-version: "4.0.0"
      - name: "Run cibuildgem"
        uses: "shopify/cibuildgem/.github/actions/cibuildgem@main"
        with:
          step: "install"
  release:
    environment: release
    permissions:
      id-token: write
      contents: read
    timeout-minutes: 5
    if: ${{ inputs.release }}
    name: "Release all gems with RubyGems"
    needs: install
    runs-on: "ubuntu-latest"
    steps:
      - name: "Setup Ruby"
        uses: "ruby/setup-ruby@v1"
        with:
          ruby-version: "4.0.0"
      - name: "Run cibuildgem"
        uses: "shopify/cibuildgem/.github/actions/cibuildgem@main"
        with:
          step: "release"
